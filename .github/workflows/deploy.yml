# Push to main -> run the suite -> deploy to Fly.
#
# A deploy restarts the server, which drops any match in progress. That is
# accepted here: the game keeps no state worth preserving across a release.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys at once once left this app running four machines, which splits
# players across servers. Never let runs overlap.
concurrency:
  group: deploy-super-sinky
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # matches node:22-alpine in the Dockerfile
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: this app must run exactly ONE machine (see fly.toml).
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
