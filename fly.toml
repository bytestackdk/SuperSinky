# Super Sinky - https://fly.io/docs/reference/configuration/
#
# This app MUST run exactly ONE machine. Lobbies, ships and the 30Hz game loop
# live in process memory, so a second instance strands players in the same
# lobby on different servers, and a stopped machine drops matches in progress.
#
# NOTE: min_machines_running below governs auto-stop, NOT machine count. Fly
# adds a second machine for HA on a first deploy unless you pass --ha=false:
#
#   fly deploy --ha=false
#
# Check with `fly machines list`; correct with `fly scale count 1`.

app = 'super-sinky'
primary_region = 'arn'

[build]

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    timeout = '2s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
